services:
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    ports:
      - "3000:3000"
  mock-courier:
    build:
      context: .
      dockerfile: apps/mock-courier/Dockerfile
    ports:
      - "3001:3001"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kplus
      POSTGRES_USER: kplus
      POSTGRES_PASSWORD: kplus
    ports:
      - "5432:5432"
