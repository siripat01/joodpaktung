services:
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://kplus:kplus@postgres:5432/kplus
      COURIER_WEBHOOK_SECRET: ${COURIER_WEBHOOK_SECRET:-local-courier-secret}
  mock-courier:
    build:
      context: .
      dockerfile: apps/mock-courier/Dockerfile
    ports:
      - "3001:3001"
    environment:
      COURIER_WEBHOOK_SECRET: ${COURIER_WEBHOOK_SECRET:-local-courier-secret}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      - core
      - postgres
    environment:
      DATABASE_URL: postgres://kplus:kplus@postgres:5432/kplus
      CORE_URL: http://core:3000
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL: 1s
      WORKER_LEASE_DURATION: 30s
      WORKER_BATCH_SIZE: 16
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kplus
      POSTGRES_USER: kplus
      POSTGRES_PASSWORD: kplus
    ports:
      - "5432:5432"
